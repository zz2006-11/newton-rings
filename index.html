<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="可实时调节波长、折射率和曲率半径的反射式牛顿环仿真">
  <title>牛顿环交互仿真</title>
  <style>
    :root{--ink:#102329;--muted:#62747a;--line:#d9e2e2;--paper:#f6f8f5;--panel:#fff;--teal:#126b68;--soft:#e3f1ee}
    *{box-sizing:border-box}
    html{background:var(--paper);overflow-x:hidden;}
    body{margin:0;background:radial-gradient(circle at 15% 8%,rgba(81,151,138,.12),transparent 28rem),var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;overflow-x:hidden;}
    button,input{font:inherit}
    .shell{width:100%;max-width:1420px;min-height:100vh;margin:auto;padding:28px clamp(16px,4vw,56px) 20px}
    .top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
    .eyebrow{margin:0 0 7px;color:var(--teal);font-size:12px;font-weight:750;letter-spacing:.15em}
    .top h1{margin:0;font-size:clamp(28px,3.4vw,46px);letter-spacing:-.04em}
    .status,.wave-chip{display:inline-flex;align-items:center;gap:9px;border:1px solid #c8d7d5;border-radius:999px;background:rgba(255,255,255,.75);padding:9px 13px;font-size:13px;font-weight:700;white-space:nowrap}
    .dot,.wave-chip i{width:8px;height:8px;border-radius:50%;background:#16847d;box-shadow:0 0 0 4px rgba(22,132,125,.12)}
    
    .workspace{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(340px,.78fr);gap:20px}
    .card{border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.91);box-shadow:0 16px 50px rgba(26,55,58,.07);padding:24px;overflow:hidden;}
    
    .heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    .heading h2{margin:0;font-size:20px;line-height:1.3}
    .heading p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .wave-chip{background:#08100f;font-style:normal}
    
    .plot-wrap{display:grid;grid-template-columns:25px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 22px 20px;width:min(100%,680px);margin:auto}
    .plot-stage{position:relative;grid-column:2;border:1px solid #1c3031;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 12px 34px rgba(0,0,0,.16)}
    canvas{display:block;width:100%;height:auto;aspect-ratio:1}
    .ylabel,.xlabel,.xticks,.yticks{color:#596b70;font-family:Consolas,monospace;font-size:11px}
    .ylabel{grid-row:1;writing-mode:vertical-rl;transform:rotate(180deg);align-self:center}
    .xticks{grid-column:2;display:flex;justify-content:space-between;padding-top:6px}
    .xlabel{grid-column:2;text-align:center;padding-top:3px}
    .yticks{position:absolute;inset:8px auto 8px 8px;z-index:2;display:flex;flex-direction:column;justify-content:space-between;color:rgba(255,255,255,.7);text-shadow:0 1px 2px #000}
    
    .control-head{align-items:flex-start;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .reset{border:1px solid #cad8d6;border-radius:9px;background:#fff;color:#345457;padding:8px 11px;cursor:pointer;font-size:12px;font-weight:700;transition:.2s}
    .reset:hover{border-color:var(--teal);color:var(--teal)}
    .controls{display:grid;gap:22px;margin-top:22px}
    .group{display:grid;gap:9px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
    .symbol{display:grid;place-items:center;min-width:25px;height:25px;border-radius:7px;background:var(--soft);color:var(--teal);font-family:Georgia,serif;font-style:italic}
    .number{display:flex;align-items:center;border:1px solid #d2dddd;border-radius:8px;overflow:hidden;background:#fbfcfb}
    .number input{width:74px;border:0;outline:0;background:transparent;padding:7px 4px 7px 9px;color:var(--ink);text-align:right;font-family:Consolas,monospace;font-size:13px}
    .number span{min-width:34px;padding-right:8px;color:var(--muted);font-size:12px}
    .range{width:100%;accent-color:var(--teal);cursor:pointer}
    .limits{display:flex;justify-content:space-between;color:#8a999d;font:10px Consolas,monospace}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
    .metrics div{border-radius:12px;background:#f0f5f3;padding:13px}
    .metrics span{display:block;margin-bottom:6px;color:var(--muted);font-size:11px}
    .metrics strong{font:700 15px Consolas,monospace}
    footer{padding:17px 0 0;color:var(--muted);text-align:center;font-size:12px}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(18,107,104,.24);outline-offset:2px}
    
    /* 桌面端放大 */
    @media(min-width:941px){
      .controls-card .eyebrow{font-size:15px}
      .controls-card .heading h2{font-size:26px}
      .controls-card .reset{font-size:15px;padding:10px 15px;border-radius:10px}
      .controls-card .controls{gap:28px;margin-top:28px}
      .controls-card .label{font-size:19px}
      .controls-card .symbol{min-width:34px;height:34px;font-size:19px;border-radius:9px}
      .controls-card .number{border-radius:10px}
      .controls-card .number input{width:92px;font-size:18px;padding:10px 4px 10px 12px}
      .controls-card .number span{min-width:44px;padding-right:12px;font-size:16px}
      .controls-card .limits{font-size:13px;margin-top:2px}
      .controls-card .metrics{gap:14px;margin-top:30px}
      .controls-card .metrics div{padding:16px;border-radius:14px}
      .controls-card .metrics span{font-size:14px}
      .controls-card .metrics strong{font-size:20px}
    }

    /* 平板端 */
    @media(max-width:940px) and (min-width:681px){
      .workspace{grid-template-columns:1fr;}
      .controls-card{order:-1;}
      .controls{grid-template-columns:repeat(2,1fr);gap:24px;}
      .row{align-items:flex-start;flex-direction:column;}
    }

    /* 手机端：紧凑布局 */
    @media(max-width:680px){
      .shell{padding:10px;}
      .top{margin-bottom:12px;align-items:flex-start;flex-direction:column;gap:8px;}
      .top h1{font-size:22px;}
      .card{border-radius:14px;padding:12px;}
      
      .workspace{display:flex;flex-direction:column;gap:12px;}
      .controls-card{order:0;}
      
      .plot-wrap{width:100%;max-width:280px;margin:0 auto;grid-template-columns:15px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 18px 16px;}
      .ylabel,.xlabel,.xticks,.yticks{font-size:10px;}
      .heading{flex-direction:column;align-items:flex-start;gap:6px;}
      .heading h2{font-size:15px;line-height:1.2;}
      .heading p{font-size:11px;margin-top:2px;}
      .wave-chip{font-size:11px;padding:5px 10px;}
      
      .control-head{padding-bottom:8px;align-items:center;flex-direction:row;}
      .controls-card .heading h2{font-size:16px;}
      .controls-card .reset{font-size:12px;padding:5px 8px;}
      .controls{gap:10px;margin-top:10px;grid-template-columns:1fr;}
      .group{gap:4px;}
      .row{align-items:center;flex-direction:row;}
      .controls-card .label{font-size:13px;gap:4px;}
      .controls-card .symbol{min-width:22px;height:22px;font-size:13px;}
      .controls-card .number input{width:60px;font-size:13px;padding:5px 2px 5px 6px;}
      .controls-card .number span{font-size:11px;min-width:26px;padding-right:4px;}
      .controls-card .limits{font-size:9px;}
      
      .metrics{margin-top:12px;gap:8px;}
      .metrics div{padding:8px;border-radius:8px;}
      .metrics span{font-size:10px;margin-bottom:2px;}
      .metrics strong{font-size:14px;}
      
      footer{padding-top:10px;font-size:10px;}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><p class="eyebrow">光学实验 · 交互模型</p><h1>牛顿环交互仿真</h1></div>
      <div class="status"><i class="dot"></i>反射式 · 中心暗斑</div>
    </header>
    <section class="workspace" aria-label="牛顿环仿真工作区">
      
      <!-- 图样区 -->
      <article class="card">
        <div class="heading">
          <div><h2>等厚干涉——牛顿环实验干涉图样</h2><p>空气膜视场：−3 mm 至 3 mm</p></div>
          <div class="wave-chip" id="waveChip"><i></i><span>500 nm</span></div>
        </div>
        <div class="plot-wrap">
          <div class="ylabel">y / mm</div>
          <div class="plot-stage">
            <div class="yticks"><span>3</span><span>0</span><span>−3</span></div>
            <canvas id="plot" width="620" height="620" role="img" aria-label="反射式牛顿环实时图样"></canvas>
          </div>
          <div class="xticks"><span>−3</span><span>0</span><span>3</span></div>
          <div class="xlabel">x / mm</div>
        </div>
      </article>

      <!-- 参数区 -->
      <aside class="card controls-card">
        <div class="heading control-head">
          <div><p class="eyebrow">实时控制</p><h2>实验参数</h2></div>
          <button class="reset" id="reset" type="button">恢复默认值</button>
        </div>
        <div class="controls">
          <div class="group">
            <div class="row">
              <label class="label" for="radius"><span>凸透镜曲率半径</span><span class="symbol">R</span></label>
              <div class="number"><input id="radiusNumber" type="number" min="0.5" max="2" step="0.01" value="0.83" aria-label="曲率半径数值"><span>m</span></div>
            </div>
            <input class="range" id="radius" type="range" min="0.5" max="2" step="0.01" value="0.83">
            <div class="limits"><span>0.5</span><span>2</span></div>
          </div>
          <div class="group">
            <div class="row">
              <label class="label" for="wavelength"><span>入射光波长</span><span class="symbol">λ</span></label>
              <div class="number"><input id="wavelengthNumber" type="number" min="380" max="780" step="1" value="500" aria-label="波长数值"><span>nm</span></div>
            </div>
            <input class="range" id="wavelength" type="range" min="380" max="780" step="1" value="500">
            <div class="limits"><span>380</span><span>780</span></div>
          </div>
          <div class="group">
            <div class="row">
              <label class="label" for="index"><span>介质折射率</span><span class="symbol">n</span></label>
              <div class="number"><input id="indexNumber" type="number" min="1" max="2" step="0.01" value="1.00" aria-label="折射率数值"><span></span></div>
            </div>
            <input class="range" id="index" type="range" min="1" max="2" step="0.01" value="1">
            <div class="limits"><span>1</span><span>2</span></div>
          </div>
          <!-- 光子数控制 -->
          <div class="group">
            <div class="row">
              <label class="label" for="photons"><span>光子数</span><span class="symbol">N</span></label>
              <div class="number"><input id="photonsNumber" type="number" min="1" max="5000" step="1" value="30" aria-label="光子数数值"><span>个</span></div>
            </div>
            <input class="range" id="photons" type="range" min="1" max="5000" step="1" value="30">
            <div class="limits"><span>1</span><span>5000</span></div>
          </div>
        </div>
        <div class="metrics" aria-live="polite">
          <div><span>轴向暗环级数</span><strong id="order">21</strong></div>
          <div><span>第一暗环半径</span><strong id="firstRadius">0.644 mm</strong></div>
        </div>
      </aside>
      
    </section>
    <footer>调节任一参数，图样、环级与单色光颜色会同步更新。</footer>
  </main>
  <script>
    (() => {
      const SIZE = 620, L = 0.003;
      const canvas = document.getElementById('plot'), ctx = canvas.getContext('2d', { alpha: false });
      
      const controls = {
        radius: document.getElementById('radius'),
        wavelength: document.getElementById('wavelength'),
        index: document.getElementById('index'),
        photons: document.getElementById('photons')
      };
      const numbers = {
        radius: document.getElementById('radiusNumber'),
        wavelength: document.getElementById('wavelengthNumber'),
        index: document.getElementById('indexNumber'),
        photons: document.getElementById('photonsNumber')
      };
      // 默认光子数设为 30，一打开就是散粒噪声状态
      const defaults = { radius: 0.83, wavelength: 500, index: 1, photons: 30 };
      let pending = 0;

      function rgb(w) {
        let r = 0, g = 0, b = 0;
        if (w < 440) { r = (440 - w) / 60; b = 1 }
        else if (w < 490) { g = (w - 440) / 50; b = 1 }
        else if (w < 510) { g = 1; b = (510 - w) / 20 }
        else if (w < 580) { r = (w - 510) / 70; g = 1 }
        else if (w < 645) { r = 1; g = (645 - w) / 65 }
        else r = 1;
        const f = w < 420 ? 0.3 + 0.7 * (w - 380) / 40 : w <= 700 ? 1 : 0.3 + 0.7 * (780 - w) / 80;
        return [r, g, b].map(v => Math.round(255 * Math.pow(Math.max(0, v * f), 0.8)));
      }

      function value(name) { return Number(controls[name].value); }

      // 模拟量子散粒噪声的随机数生成器
      function getNoisyIntensity(lambda) {
        if (lambda <= 0) return 0;
        if (lambda < 100) {
          // Knuth 算法（小数值时的精准泊松分布）
          let L = Math.exp(-lambda), k = 0, p = 1;
          do { k++; p *= Math.random(); } while (p > L);
          return k - 1;
        } else {
          // 大数值时使用正态分布近似（性能更好）
          let noise = (Math.random() + Math.random() + Math.random() + Math.random() + Math.random() + Math.random() - 3) * 1.4142;
          return Math.max(0, Math.round(lambda + noise * Math.sqrt(lambda)));
        }
      }

      function draw() {
        pending = 0;
        const R = value('radius');
        const wlNm = value('wavelength');
        const n = value('index');
        const photons = value('photons');
        const wl = wlNm * 1e-9;
        const c = rgb(wlNm);
        
        const image = ctx.createImageData(SIZE, SIZE);
        const d = image.data;
        const span = L * 2;

        for (let y = 0; y < SIZE; y++) {
          const py = L - y / (SIZE - 1) * span;
          for (let x = 0; x < SIZE; x++) {
            const px = -L + x / (SIZE - 1) * span;
            const phase = 2 * Math.PI * n * (px * px + py * py) / (R * wl);
            
            // 理论连续光强 [0, 1]
            const I = (1 - Math.cos(phase)) / 2;
            
            // 加入光子散粒噪声
            const expectedPhotons = I * photons;
            const actualPhotons = getNoisyIntensity(expectedPhotons);
            
            // 计算显示亮度
            const V = Math.min(1, actualPhotons / photons);
            
            const o = (y * SIZE + x) * 4;
            d[o]     = Math.round(c[0] * V);
            d[o + 1] = Math.round(c[1] * V);
            d[o + 2] = Math.round(c[2] * V);
            d[o + 3] = 255;
          }
        }
        ctx.putImageData(image, 0, 0);

        const chip = document.getElementById('waveChip');
        chip.style.color = `rgb(${c.join(',')})`;
        chip.style.borderColor = `rgba(${c.join(',')},.45)`;
        chip.querySelector('i').style.background = `rgb(${c.join(',')})`;
        chip.querySelector('span').textContent = `${wlNm.toFixed(0)} nm`;
        
        document.getElementById('order').textContent = Math.floor(n * L * L / (R * wl));
        document.getElementById('firstRadius').textContent = `${(Math.sqrt(R * wl / n) * 1000).toFixed(3)} mm`;
        canvas.setAttribute('aria-label', `波长${wlNm.toFixed(0)}纳米、曲率半径${R.toFixed(2)}米、折射率${n.toFixed(2)}、光子数${photons}的反射式牛顿环图样`);
      }

      function schedule() {
        if (!pending) pending = requestAnimationFrame(draw);
      }

      Object.keys(controls).forEach(name => {
        controls[name].addEventListener('input', () => {
          // 光子数和波长显示为整数，其他保留两位小数
          numbers[name].value = (name === 'wavelength' || name === 'photons') 
            ? Number(controls[name].value).toFixed(0) 
            : Number(controls[name].value).toFixed(2);
          schedule();
        });
        numbers[name].addEventListener('change', () => {
          const min = Number(controls[name].min), max = Number(controls[name].max);
          const v = Math.min(max, Math.max(min, Number(numbers[name].value)));
          if (Number.isFinite(v)) {
            controls[name].value = String(v);
            numbers[name].value = (name === 'wavelength' || name === 'photons') 
              ? v.toFixed(0) 
              : v.toFixed(2);
            schedule();
          }
        });
      });

      document.getElementById('reset').addEventListener('click', () => {
        Object.keys(defaults).forEach(name => {
          controls[name].value = String(defaults[name]);
          numbers[name].value = (name === 'wavelength' || name === 'photons') 
            ? defaults[name].toFixed(0) 
            : defaults[name].toFixed(2);
        });
        schedule();
      });

      draw();
    })();
  </script>
</body>
</html>
